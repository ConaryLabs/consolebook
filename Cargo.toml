[workspace]
members = ["crates/consolebook-server"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/FieldmouseWorks/consolebook"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Revisit before the API stabilizes; error/panic doc sections are noise while
# every public function is pre-alpha and changing shape.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
