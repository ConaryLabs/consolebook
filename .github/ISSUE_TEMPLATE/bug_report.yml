name: Bug report
description: Report incorrect behavior in Consolebook.
body:
  - type: markdown
    attributes:
      value: |
        Consolebook is pre-alpha. Reports about implemented behavior are welcome; missing features belong in a work item.
  - type: checkboxes
    id: existing_issue
    attributes:
      label: Existing issue check
      options:
        - label: I searched open and closed issues for this bug.
          required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Exact observed behavior, with exact command output or log lines where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Smallest sequence of commands or steps that reproduces the behavior.
      placeholder: |
        1. `consolebook serve --data-dir ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Consolebook version or commit, operating system, and anything unusual about the deployment.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real training records, personnel information, operational narratives, or credentials; all example data is invented.
          required: true
